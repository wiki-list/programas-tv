<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel de Programação TelaBrasilTV</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                radial-gradient(circle at top, #1f2937, #0f172a 60%);
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            padding: 30px;
        }

        .titulo {
            text-align: center;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .canal {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow:
                0 10px 25px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .canal:hover {
            transform: translateY(-5px);
        }

        .topo {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            padding: 25px;
            text-align: center;
        }

        .topo img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 20px;
            margin-bottom: 15px;
            background: white;
            padding: 5px;
        }

        .topo h2 {
            font-size: 24px;
        }

        .programas {
            padding: 20px;
        }

        .programa {
            background: rgba(255,255,255,0.06);
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 18px;
            border-left: 5px solid #60a5fa;
        }

        .programa h4 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #fff;
        }

        .horario {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        .reprises-label{
            font-size:13px;
            color:#60a5fa;
            margin-bottom:10px;
            text-transform:uppercase;
            font-weight:bold;
            letter-spacing:1px;
        }

        .reprises {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tag {
            background: rgba(96,165,250,0.15);
            border: 1px solid rgba(96,165,250,0.4);
            padding: 8px 10px;
            border-radius: 12px;
            font-size: 14px;
            color: #bfdbfe;
        }

        @media(max-width:1400px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width:800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

    </style>
</head>

<body>

    <div class="titulo">
        PAINEL DE PROGRAMAÇÃO TELA BRASIL TV
    </div>

    <div class="grid" id="grid-canais"></div>
<script>

    const canais = [
        {
            "name": "Tela Brasil TV",
            "slug": "tela-brasil-tv",
            "id": "697bd6b5e2423fac145bcca9",
            "logo_url": "https://base44.app/api/apps/6977d51de24ba622b5ba311e/files/public/6977d51de24ba622b5ba311e/6b0af0a3b_Semnome1200x1100px1.png",
        },
        {
            "name": "Reviva TV",
            "slug": "revivatv",
            "id": "697a69367f158c4f8d0e0470",
            "logo_url": "https://base44.app/api/apps/6977d51de24ba622b5ba311e/files/mp/public/6977d51de24ba622b5ba311e/22488e4f9_Designsemnome10.png",
        },
        {
            "name": "Televiva",
            "slug": "televiva",
            "id": "6977d6c04b16d8945bcbb1a4",
            "logo_url": "https://base44.app/api/apps/6977d51de24ba622b5ba311e/files/public/6977d51de24ba622b5ba311e/c5100ba3f_InstagramPostDiadasMesminimalistavermelhoebranco1080x1080px1920x1080px.png",
        },
        {
            "name": "Multimix",
            "slug": "multimix",
            "id": "6977d6c04b16d8945bcbb1a5",
            "logo_url": "https://base44.app/api/apps/6977d51de24ba622b5ba311e/files/public/6977d51de24ba622b5ba311e/31ebed5f3_ApresentaoInstitucionalGrtis169colorido.jpg",
        },
    ];

    const url =
        "https://stream-sync-b5ba311e.base44.app/api/apps/6977d51de24ba622b5ba311e/entities/ProgramSchedule";

    function formatarData(dias = 0) {
        const d = new Date();
        d.setDate(d.getDate() + dias);
        return d.toLocaleDateString('pt-BR');
    }

    function calcularDuracao(inicio, fim) {

        const [h1, m1] = inicio.split(':').map(Number);
        const [h2, m2] = fim.split(':').map(Number);

        let start = h1 * 3600 + m1 * 60;
        let end = h2 * 3600 + m2 * 60;

        if (end < start) end += 86400;

        let diff = end - start;

        return `${String(Math.floor(diff / 3600)).padStart(2,'0')}:${String(Math.floor((diff % 3600)/60)).padStart(2,'0')}:${String(diff % 60).padStart(2,'0')}`;
    }

    async function carregarProgramacao() {

        const res = await fetch(url);
        const programas = await res.json();

        const grid = document.getElementById('grid-canais');

        canais.forEach(canal => {

            let htmlProgramas = '';

            const agrupados = {};
            const agora = new Date();

            // 🔥 AGRUPAR + GERAR REPRISES CORRETAS
            programas.forEach(p => {

                if (!p.is_active) return;
                if (p.webtv_id !== canal.id) return;

                const chave = p.program_name;

                if (!agrupados[chave]) {
                    agrupados[chave] = {
                        program_name: p.program_name,
                        start_time: p.start_time,
                        end_time: p.end_time,
                        weekdays: p.weekdays,
                        reprises: []
                    };
                }

                for (let d = 0; d < 7; d++) {

                    const data = new Date();
                    data.setDate(data.getDate() + d);

                    let weekday = data.getDay();
                    if (weekday === 0) weekday = 7;

                    if ((p.weekdays || []).includes(weekday)) {

                        const [h, m] = p.start_time.split(':');

                        const dt = new Date(data);
                        dt.setHours(+h, +m, 0, 0);

                        // 🔥 SÓ FUTURO
                        if (dt.getTime() > agora.getTime()) {

                            agrupados[chave].reprises.push({
                                date: data.toLocaleDateString('pt-BR'),
                                start: p.start_time,
                                end: p.end_time,
                                time: dt.getTime() // 🔥 FIX ORDEM REAL
                            });

                        }
                    }
                }

            });

            // 🔥 RENDER
            Object.values(agrupados).forEach(p => {

                let reprisesHtml = '';

                p.reprises
                    .sort((a,b) => a.time - b.time)
                    .forEach(r => {

                        reprisesHtml += `
                            <div class="tag">
                                📺 ${r.date} às ${r.start} - ${r.end}
                            </div>
                        `;
                    });

                htmlProgramas += `
                    <div class="programa">

                        <h4>${p.program_name}</h4>

                        <div class="horario">
                            ${formatarData()} 
                            ${p.start_time} - ${p.end_time} 
                            (${calcularDuracao(p.start_time, p.end_time)})
                        </div>

                        ${p.reprises.length > 0 ? `
                            <div class="reprises-label">
                                Reprises
                            </div>

                            <div class="reprises">
                                ${reprisesHtml}
                            </div>
                        ` : ''}

                    </div>
                `;

            });

            grid.innerHTML += `
                <div class="canal">

                    <div class="topo">
                        <img src="${canal.logo_url}">
                        <h2>${canal.name}</h2>
                    </div>

                    <div class="programas">
                        ${htmlProgramas}
                    </div>

                </div>
            `;

        });

    }

    carregarProgramacao();

</script>
</body>

</html>
